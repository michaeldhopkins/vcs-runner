[package]
name = "vcs-runner"
version = "0.11.0"
edition = "2024"
rust-version = "1.91"
description = "Subprocess runner for jj and git with retry, timeouts, repo detection, and structured output parsing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michaeldhopkins/vcs-runner"
homepage = "https://github.com/michaeldhopkins/vcs-runner"
readme = "README.md"
keywords = ["jujutsu", "jj", "git", "subprocess", "vcs"]
categories = ["development-tools"]
# Dev-only files excluded from the published crate.
exclude = [
    "scripts/",
    ".github/",
    "CLAUDE.md",
    "cliff.toml",
    "clippy.toml",
    "deny.toml",
]

[features]
default = ["jj-parse", "git-parse"]
jj-parse = ["dep:serde", "dep:serde_json"]
git-parse = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = "1"
procpilot = "0.6"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
struct-excessive-bools = "deny"
fn-params-excessive-bools = "deny"
collapsible-if = "deny"
too-many-arguments = "deny"
needless-range-loop = "deny"
extend_with_drain = "deny"
unwrap_used = "deny"
match_bool = "warn"
bool_to_int_with_if = "warn"
cognitive-complexity = "warn"
too-many-lines = "warn"
