# Standalone workspace (see the empty `[workspace]` below): the root
# `cargo build` / `test` / `clippy` / `deny` never see it, so the main crate stays
# on stable while this builds only under `cargo fuzz`, which needs nightly for
# `-Zsanitizer`.

[package]
name = "vcs-runner-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# The roundtrip targets render jj's `escape_json()` output the way jj does, with serde_json.
serde_json = "1"
tempfile = "3"

[dependencies.vcs-runner]
path = ".."

[workspace]

# Line-level debug info so a crash stack trace names the vcs-runner function.
[profile.release]
debug = 1

[[bin]]
name = "vcs_output"
path = "fuzz_targets/vcs_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_roundtrip"
path = "fuzz_targets/log_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bookmark_roundtrip"
path = "fuzz_targets/bookmark_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_summary_roundtrip"
path = "fuzz_targets/diff_summary_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "detect_root"
path = "fuzz_targets/detect_root.rs"
test = false
doc = false
bench = false
