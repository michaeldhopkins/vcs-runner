name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version and components come from rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: |
          cargo fmt --all --check
          cargo fmt --all --check --manifest-path fuzz/Cargo.toml

      - name: cargo check
        run: cargo check --locked

      - name: cargo check (no default features)
        run: cargo check --locked --no-default-features

      - name: cargo test
        run: cargo test --locked

      - name: cargo test (no default features)
        run: cargo test --locked --no-default-features

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

      - name: cargo doc (catches broken links)
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # vcs-runner supports jj 0.33 and later (AGENTS.md "Supported jj versions"). Every
  # test that shells out to jj runs against the oldest supported release, the ones where
  # a spelling changed, and the newest captured, so a jj-version regression names the
  # version. The parsers' per-version fixtures (src/jj_compat_tests.rs) run in `ci`.
  jj-versions:
    name: Test with jj ${{ matrix.jj }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jj: ["0.33.0", "0.36.0", "0.37.0", "0.38.0", "0.40.0", "0.45.1", "0.46.0"]
    steps:
      - uses: actions/checkout@v7

      # The version and components come from rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install jj ${{ matrix.jj }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/jj"
          gh release download "v${{ matrix.jj }}" -R jj-vcs/jj \
            -p "jj-v${{ matrix.jj }}-x86_64-unknown-linux-musl.tar.gz" -O - \
            | tar -xz -C "$RUNNER_TEMP/jj"
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"

      - name: Confirm the jj under test
        run: jj --version | grep -F "jj ${{ matrix.jj }}"

      - name: cargo test
        run: cargo test --locked --all-features

  # The published crate declares `rust-version`; this is what makes that claim true.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the declared minimum Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          # Every later step, rust-cache's key included, runs on the MSRV rather than the
          # toolchain rust-toolchain.toml pins.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: cargo check on the MSRV
        run: cargo +"$MSRV" check --locked
